name: crm-settlement

services:
  crm-platform:
    image: ${CRM_IMAGE:-ghcr.io/hydintern3/crm-settlement:latest}
    build:
      context: ./platform
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3100}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
