# Insert these locations inside the existing default server block.
# Keep the existing content-pipeline location / unchanged.

location = /crm {
    return 301 /crm/;
}

# Vinext App Router emits base-path-prefixed asset URLs, while its standalone
# static server exposes the generated files from /assets/.
location /crm/assets/ {
    proxy_pass http://127.0.0.1:3100/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /crm/ {
    client_max_body_size 105m;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
