name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CRM_IMAGE: ghcr.io/hydintern3/crm-settlement:latest
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment build
        run: npm run verify

      - name: Build self-hosted container
        run: docker compose -f ../compose.yaml build

      - name: Start self-hosted container
        env:
          APP_PORT: 3100
          BIND_ADDRESS: 127.0.0.1
        run: docker compose -f ../compose.yaml up -d

      - name: Check container health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/crm/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f ../compose.yaml ps
          docker compose -f ../compose.yaml logs crm-platform
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish self-hosted image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image_name=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          docker tag "$image_name:latest" "$image_name:${GITHUB_SHA}"
          docker push "$image_name:latest"
          docker push "$image_name:${GITHUB_SHA}"

      - name: Stop self-hosted container
        if: always()
        env:
          APP_PORT: 3100
          BIND_ADDRESS: 127.0.0.1
        run: docker compose -f ../compose.yaml down
